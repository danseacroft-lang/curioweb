<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ventus • Weather, beautifully visualised</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.1/dist/maplibre-gl.css">
<style>
:root{
  --bg:#eef1f5;--panel:rgba(255,255,255,.76);--panel2:rgba(255,255,255,.58);
  --text:#111827;--muted:#667085;--line:rgba(17,24,39,.10);
  --accent:#1677ff;--shadow:0 20px 60px rgba(15,23,42,.16);
}
*{box-sizing:border-box}
html,body,#map{height:100%;margin:0}
body{overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
body.dark{--bg:#0b0f16;--panel:rgba(18,23,32,.78);--panel2:rgba(18,23,32,.58);--text:#f5f7fb;--muted:#9aa5b5;--line:rgba(255,255,255,.10);--shadow:0 24px 70px rgba(0,0,0,.38)}
#map{position:fixed;inset:0}
.glass{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%)}
.topbar{position:fixed;top:18px;left:18px;right:18px;display:flex;align-items:center;gap:14px;z-index:10;pointer-events:none}
.brand,.search,.top-actions{pointer-events:auto}
.brand{padding:11px 15px;border-radius:18px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,#1d8cff,#7b5cff);display:grid;place-items:center;color:white;font-weight:800;box-shadow:0 7px 18px rgba(36,113,255,.3)}
.brand strong{font-size:18px;letter-spacing:-.03em}.brand span{font-size:12px;color:var(--muted)}
.search{height:52px;flex:1;max-width:560px;border-radius:18px;display:flex;align-items:center;padding:0 16px;gap:10px}
.search input{border:0;outline:0;background:transparent;color:var(--text);width:100%;font:500 15px inherit}
.search kbd{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:4px 7px;border-radius:7px}
.top-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn,.layer-btn,.play,.unit{border:1px solid var(--line);background:var(--panel);color:var(--text);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);cursor:pointer}
.icon-btn{width:48px;height:48px;border-radius:16px;font-size:18px}.icon-btn:hover,.layer-btn:hover,.play:hover,.unit:hover{transform:translateY(-1px);filter:brightness(1.04)}
.sidebar{position:fixed;left:18px;top:88px;width:205px;z-index:9;padding:10px;border-radius:22px}
.layer-btn{width:100%;height:44px;margin:3px 0;border-radius:14px;text-align:left;padding:0 13px;font-weight:650;font-size:13px;box-shadow:none;background:transparent}
.layer-btn.active{background:var(--accent);color:white;border-color:transparent;box-shadow:0 8px 22px rgba(22,119,255,.28)}
.layer-btn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;background:currentColor;vertical-align:1px}
.info{position:fixed;right:18px;top:88px;width:280px;padding:18px;border-radius:22px;z-index:9;transform:translateX(330px);transition:.35s cubic-bezier(.2,.8,.2,1)}
.info.show{transform:none}
.info h2{font-size:16px;margin:0 0 4px}.info p{margin:0;color:var(--muted);font-size:12px}
.temp{font-size:46px;letter-spacing:-.07em;margin:14px 0 2px;font-weight:700}.conditions{font-size:14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.meta div{padding:10px;border:1px solid var(--line);border-radius:13px}.meta b{display:block;font-size:12px}.meta span{font-size:11px;color:var(--muted)}
.timeline{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(850px,calc(100vw - 36px));padding:12px 14px 13px;border-radius:22px;z-index:10}
.timeline-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}.timeline-head strong{font-size:13px}.timeline-head span{font-size:12px;color:var(--muted);margin-left:auto}
.play{width:42px;height:42px;border-radius:13px;font-size:16px;box-shadow:none}.slider{width:100%;accent-color:var(--accent);cursor:pointer}
.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;padding:0 3px}
.units{position:fixed;right:18px;bottom:18px;z-index:11;display:flex;gap:6px}.unit{border-radius:13px;padding:10px 12px;font-weight:700;font-size:12px;box-shadow:var(--shadow)}.unit.active{background:var(--text);color:var(--bg)}
.status{position:fixed;left:18px;bottom:18px;z-index:8;padding:9px 12px;border-radius:13px;font-size:11px;color:var(--muted)}
.maplibregl-ctrl-group{border-radius:14px!important;overflow:hidden;background:var(--panel)!important;border:1px solid var(--line)!important;box-shadow:var(--shadow)!important;backdrop-filter:blur(20px)}
.maplibregl-ctrl-group button{background:transparent!important}
.maplibregl-ctrl-top-right{top:88px;right:18px}.maplibregl-ctrl-bottom-right{bottom:102px}
.temp-marker{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4);white-space:nowrap}
@media(max-width:800px){
 .topbar{top:10px;left:10px;right:10px}.brand span{display:none}.brand{padding:9px}.search{height:46px}.top-actions .icon-btn:nth-child(2){display:none}
 .sidebar{top:auto;bottom:104px;left:10px;width:calc(100vw - 20px);display:flex;gap:6px;overflow:auto;padding:7px;border-radius:18px}.layer-btn{min-width:118px;width:auto;margin:0;text-align:center}
 .info{top:70px;right:10px;left:10px;width:auto}.info.show{transform:none}.timeline{bottom:10px;width:calc(100vw - 20px)}.status{display:none}.units{right:10px;bottom:101px}.maplibregl-ctrl-top-right{top:66px;right:10px}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand glass"><div class="mark">V</div><div><strong>Ventus</strong><br><span>Weather, beautifully visualised</span></div></div>
  <label class="search glass"><span>⌕</span><input id="search" placeholder="Search a place…" autocomplete="off"><kbd>⌘ K</kbd></label>
  <div class="top-actions"><button class="icon-btn" id="locate" title="My location">⌖</button><button class="icon-btn" id="theme" title="Appearance">☾</button></div>
</div>

<div class="sidebar glass" id="layers">
  <button class="layer-btn active" data-layer="temperature"><span class="dot"></span>Temperature</button>
  <button class="layer-btn" data-layer="wind"><span class="dot"></span>Wind</button>
  <button class="layer-btn" data-layer="rain"><span class="dot"></span>Precipitation</button>
  <button class="layer-btn" data-layer="cloud"><span class="dot"></span>Cloud cover</button>
  <button class="layer-btn" data-layer="pressure"><span class="dot"></span>Pressure</button>
  <button class="layer-btn" data-layer="snow"><span class="dot"></span>Snow</button>
</div>

<section class="info glass" id="info">
  <h2 id="place">United Kingdom</h2><p id="coords">Click anywhere on the map</p>
  <div class="temp" id="temp">—</div><div class="conditions" id="conditions">Loading weather…</div>
  <div class="meta"><div><b id="wind">—</b><span>Wind</span></div><div><b id="rain">—</b><span>Precipitation</span></div><div><b id="humidity">—</b><span>Humidity</span></div><div><b id="pressure">—</b><span>Pressure</span></div></div>
</section>

<div class="status glass" id="status">Weather data loading…</div>

<div class="timeline glass">
  <div class="timeline-head"><button class="play" id="play">▶</button><strong>Forecast</strong><span id="timeLabel">Now</span></div>
  <input class="slider" id="time" type="range" min="0" max="47" value="0">
  <div class="ticks"><span>Now</span><span>+12h</span><span>+1 day</span><span>+2 days</span></div>
</div>

<div class="units"><button class="unit active" data-unit="c">°C</button><button class="unit" data-unit="f">°F</button></div>

<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.11.1/dist/maplibre-gl.mjs';

const map = new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/bright',
  center:[-2.2,54.2],
  zoom:4.4,
  attributionControl:true
});
map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');

let unit='c', currentLayer='temperature', forecast=[], selected={lat:54.2,lon:-2.2,name:'United Kingdom'}, timer=null;
const $=id=>document.getElementById(id);

function cToF(v){return v*9/5+32}
function tempText(v){if(v==null)return '—';return `${Math.round(unit==='c'?v:cToF(v))}°`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function weather(lat,lon,name='Selected location'){
  selected={lat,lon,name};
  $('status').textContent='Fetching forecast…';
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,precipitation,cloud_cover,surface_pressure,wind_speed_10m,wind_direction_10m,snowfall,relative_humidity_2m&forecast_days=7&wind_speed_unit=kmh&timezone=auto`;
  try{
    const r=await fetch(u); const d=await r.json();
    forecast=d.hourly.time.map((t,i)=>({time:t,temp:d.hourly.temperature_2m[i],rain:d.hourly.precipitation[i],prob:d.hourly.precipitation_probability[i],cloud:d.hourly.cloud_cover[i],pressure:d.hourly.surface_pressure[i],wind:d.hourly.wind_speed_10m[i],dir:d.hourly.wind_direction_10m[i],snow:d.hourly.snowfall[i],humidity:d.hourly.relative_humidity_2m[i]}));
    $('status').textContent='Live forecast data';
    $('info').classList.add('show'); updateInfo(0);
  }catch(e){$('status').textContent='Weather data unavailable';console.error(e)}
}
function updateInfo(i){
  const x=forecast[Math.min(i,forecast.length-1)]; if(!x)return;
  $('place').textContent=selected.name;$('coords').textContent=`${selected.lat.toFixed(2)}°, ${selected.lon.toFixed(2)}°`;
  $('temp').textContent=tempText(x.temp);
  $('conditions').textContent=x.rain>0.1?`Rain ${x.rain.toFixed(1)} mm`:`Wind ${Math.round(x.wind)} km/h`;
  $('wind').textContent=`${Math.round(x.wind)} km/h`;
  $('rain').textContent=`${Math.round(x.prob)}%`;
  $('humidity').textContent=`${Math.round(x.humidity)}%`;
  $('pressure').textContent=`${Math.round(x.pressure)} hPa`;
  const d=new Date(x.time); $('timeLabel').textContent=i===0?'Now':d.toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'});
  $('time').value=i;
}
map.on('click',async e=>{
  const {lat,lng}=e.lngLat;
  await weather(lat,lng,`${lat.toFixed(2)}°, ${lng.toFixed(2)}°`);
});
$('time').addEventListener('input',e=>updateInfo(+e.target.value));
$('play').addEventListener('click',()=>{
  if(timer){clearInterval(timer);timer=null;$('play').textContent='▶';return}
  $('play').textContent='Ⅱ';
  let i=+$('time').value; timer=setInterval(()=>{i=(i+1)%48;updateInfo(i)},700);
});
document.querySelectorAll('.unit').forEach(b=>b.onclick=()=>{unit=b.dataset.unit;document.querySelectorAll('.unit').forEach(x=>x.classList.toggle('active',x===b));updateInfo(+$('time').value)});
document.querySelectorAll('.layer-btn').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.layer-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentLayer=b.dataset.layer;
 $('status').textContent=`${b.textContent.trim()} layer selected`;
});
$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'☀':'☾'};
$('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:8,duration:1300});weather(p.coords.latitude,p.coords.longitude,'Your location')});
$('search').addEventListener('keydown',async e=>{
 if(e.key!=='Enter')return;
 const q=e.target.value.trim();if(!q)return;
 try{
   const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
   const d=await r.json();const x=d.results?.[0];if(!x)return;
   map.flyTo({center:[x.longitude,x.latitude],zoom:9,duration:1400});weather(x.latitude,x.longitude,x.name+(x.country?`, ${x.country}`:''));
 }catch{}
});
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus()}});
weather(selected.lat,selected.lon,selected.name);
</script>
</body>
</html>
