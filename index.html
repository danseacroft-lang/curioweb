<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3fb">
<title>Liquid Speed</title>
<style>
:root{
  --bg:#edf2f8;
  --ink:#10131a;
  --muted:#737b88;
  --glass:rgba(255,255,255,.46);
  --glass-strong:rgba(255,255,255,.62);
  --stroke:rgba(255,255,255,.72);
  --shadow:0 30px 80px rgba(45,62,92,.16),0 8px 28px rgba(45,62,92,.10);
  --accent:#111318;
  --blue:#3478f6;
  --page-glow:rgba(255,255,255,.72);
  --reflection-x:50%;
  --reflection-y:20%;
}
body.dark{
  --bg:#080a0f;
  --ink:#f5f7fb;
  --muted:#9aa3b2;
  --glass:rgba(25,28,35,.48);
  --glass-strong:rgba(34,38,47,.62);
  --stroke:rgba(255,255,255,.14);
  --shadow:0 30px 90px rgba(0,0,0,.46),0 8px 30px rgba(0,0,0,.32);
  --accent:#fff;
  --blue:#69a1ff;
  --page-glow:rgba(255,255,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;color:var(--ink)}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 12% 12%,rgba(112,177,255,.38),transparent 30%),
    radial-gradient(circle at 88% 18%,rgba(214,173,255,.34),transparent 30%),
    radial-gradient(circle at 70% 90%,rgba(110,229,209,.30),transparent 34%),
    linear-gradient(135deg,#f6f8fb,#e7edf6 55%,#f3f6fa);
  transition:background .55s ease,color .4s ease;
}
body.dark{
  background:
    radial-gradient(circle at 12% 12%,rgba(55,110,190,.25),transparent 30%),
    radial-gradient(circle at 88% 18%,rgba(125,76,180,.20),transparent 30%),
    radial-gradient(circle at 70% 90%,rgba(40,145,132,.18),transparent 34%),
    linear-gradient(135deg,#080a0f,#11151d 55%,#080a0f);
}
body:before{
  content:"";position:fixed;inset:-30%;pointer-events:none;opacity:.22;
  background:conic-gradient(from 180deg,transparent,rgba(255,255,255,.9),transparent 32%,rgba(132,184,255,.24),transparent 62%);
  filter:blur(70px);animation:aurora 18s ease-in-out infinite alternate;
}
@keyframes aurora{to{transform:rotate(18deg) translate3d(4%,2%,0) scale(1.05)}}
.app{min-height:100vh;padding:28px clamp(18px,4vw,54px) 36px;display:flex;flex-direction:column}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:1160px;width:100%;margin:auto auto 20px}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;letter-spacing:-.03em}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,#fff,#cbd5e4);box-shadow:inset 1px 1px 1px #fff,0 7px 20px #7183a430;position:relative}
.logo:after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#111318;left:9px;top:9px;box-shadow:0 0 12px #11131855}
.nav-note{font-size:12px;color:var(--muted);font-weight:600}
.stage{
  width:min(1160px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;
}
.glass{
  position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--stroke);
  box-shadow:var(--shadow);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
}
.glass:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at var(--reflection-x) var(--reflection-y),
      var(--page-glow) 0%, rgba(255,255,255,.22) 9%, rgba(255,255,255,.07) 19%, transparent 38%),
    linear-gradient(125deg,rgba(255,255,255,.58),transparent 22%,transparent 68%,rgba(255,255,255,.18));
  opacity:.86;
  transition:background-position .08s linear;
}
.main{min-height:610px;border-radius:42px;padding:42px 34px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.main:after{
  content:"";position:absolute;left:15%;right:15%;top:0;height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.95
}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#7d8490;font-weight:700;margin-bottom:18px}
h1{font-size:clamp(38px,6vw,70px);line-height:.95;letter-spacing:-.065em;margin:0 0 13px;text-align:center;font-weight:700}
.subtitle{font-size:15px;color:var(--muted);text-align:center;margin:0 0 34px}
.gauge-wrap{width:min(390px,76vw);aspect-ratio:1;position:relative;margin:0 auto 26px}
.gauge{
  width:100%;height:100%;border-radius:50%;padding:12px;
  background:conic-gradient(from 0deg,#111318 0deg,var(--blue) var(--progress,0deg),rgba(120,132,150,.12) var(--progress,0deg) 360deg);
  box-shadow:0 22px 55px rgba(42,59,89,.18),inset 0 0 0 1px rgba(255,255,255,.55);
  transition:background .25s ease;
}
.gauge-inner{height:100%;width:100%;border-radius:50%;background:rgba(247,249,252,.68);border:1px solid rgba(255,255,255,.85);display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:inset 0 1px 18px rgba(255,255,255,.7)}
.speed{font-size:clamp(58px,9vw,94px);font-weight:700;letter-spacing:-.075em;line-height:.9;font-variant-numeric:tabular-nums}
.unit{font-size:15px;color:var(--muted);font-weight:700;margin-top:10px}
.status{height:20px;margin-top:8px;font-size:12px;color:var(--muted);font-weight:600}
.controls{display:flex;align-items:center;gap:10px}
.button{
  border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;padding:14px 24px;
  background:rgba(18,20,24,.95);color:#fff;box-shadow:0 10px 24px rgba(18,20,24,.22),inset 0 1px rgba(255,255,255,.18);
  transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
}
.button:hover{transform:translateY(-1px);box-shadow:0 13px 28px rgba(18,20,24,.26)}
.button:active{transform:scale(.97)}
.button:disabled{opacity:.55;cursor:default;transform:none}
.secondary{background:rgba(255,255,255,.54);color:var(--ink);border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 20px rgba(55,70,95,.10)}
.side{border-radius:32px;padding:22px;display:flex;flex-direction:column;gap:12px}
.side h2{font-size:13px;margin:0 0 4px;color:#777f8d;text-transform:uppercase;letter-spacing:.12em}
.metric{
  position:relative;border-radius:23px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.72);
  padding:18px 17px;box-shadow:inset 0 1px rgba(255,255,255,.6)
}
.metric-top{display:flex;justify-content:space-between;align-items:center;color:#7b8290;font-size:12px;font-weight:650}
.metric-value{font-size:27px;font-weight:700;letter-spacing:-.04em;margin-top:7px;font-variant-numeric:tabular-nums}
.metric-unit{font-size:12px;color:#7b8290;font-weight:650;margin-left:3px}
.footer{max-width:1160px;width:100%;margin:15px auto 0;display:flex;justify-content:space-between;color:#858c98;font-size:11px;padding:0 5px}
.dot{width:7px;height:7px;border-radius:50%;background:#53bf83;display:inline-block;margin-right:7px;box-shadow:0 0 0 4px #53bf8320}

.theme-button {
  appearance: none;
  -webkit-appearance: none;
  box-sizing: border-box;
  width: 42px;
  height: 42px;
  min-width: 42px;
  min-height: 42px;
  padding: 0;
  margin: 0;
  position: relative;
  display: grid;
  place-items: center;
  flex: 0 0 42px;
  overflow: hidden;
  border: 1px solid var(--stroke);
  border-radius: 50%;
  background: var(--glass-strong);
  color: var(--ink);
  box-shadow: var(--shadow);
  cursor: pointer;
  line-height: 0;
  font-size: 0;
  isolation: isolate;
  transition: transform .2s ease, background .2s ease, border-color .2s ease;
}
.theme-button:hover { transform: translateY(-1px) scale(1.03); }
.theme-button:active { transform: scale(.96); }

.theme-icon {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  line-height: 1;
  font-size: 19px;
  font-family: Arial, sans-serif;
  font-weight: 400;
  pointer-events: none;
}
body.dark body.dark body.dark .theme-button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);box-shadow:0 8px 24px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.10)}
.theme-button:hover{transform:translateY(-1px) scale(1.03)}
.theme-button:active{transform:scale(.94)}
.theme-icon{width:18px;height:18px;position:relative;display:block}
body.dark @media(max-width:850px){.stage{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(3,1fr)}.side h2{grid-column:1/-1}.main{min-height:570px}.footer{display:none}}
@media(max-width:560px){.app{padding:18px 12px 22px}.nav{margin-bottom:12px}.main{border-radius:32px;padding:34px 16px 26px}.side{border-radius:26px;padding:13px;grid-template-columns:1fr 1fr 1fr;gap:8px}.metric{padding:13px 11px;border-radius:18px}.metric-value{font-size:21px}.nav-note{display:none}.gauge-wrap{width:min(330px,82vw)}}

.connection-identity {
  width: 100%;
  margin: 0 0 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  text-align: center;
}

.connection-identity strong {
  display: block;
  max-width: 100%;
  font-size: 17px;
  font-weight: 750;
  line-height: 1.2;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}

.connection-identity span {
  display: block;
  max-width: 100%;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.3;
  text-align: center;
  overflow-wrap: anywhere;
}

</style>
</head>
<body>
<div class="app">
  <header class="nav">
    <div class="brand"><span class="logo"></span><span>Liquid Speed</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="nav-note"><span class="dot"></span></div>
      <button class="theme-button" id="themeToggle" type="button"
        aria-label="Switch to dark mode" title="Switch to dark mode">
        <span class="theme-icon" id="themeIcon" aria-hidden="true">☀</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <section class="glass main">
      <div class="eyebrow" id="greeting">Good afternoon</div>
      <h1 id="headline">How fast is your internet?</h1>
      <p class="subtitle" id="subtitle">Press the button below to test your connection, It shall only take a moment.</p>

      <div class="gauge-wrap" aria-live="polite">
        <div class="gauge" id="gauge" style="--progress:0deg">
          <div class="gauge-inner">
            <div class="speed" id="speed">0</div>
            <div class="unit" id="unit">Mbps</div>
            <div class="status" id="status">Ready</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="button" id="start">Start speed test</button>
        <button class="button secondary" id="again" hidden>Test again</button>
      </div>
    </section>

    <aside class="glass side">
      <div class="connection-identity">
        <strong id="userIp">Loading IP…</strong>
        <span id="userProvider">Finding provider…</span>
      </div>
      <div class="metric"><div class="metric-top"><span>Ping</span><span>↔</span></div><div class="metric-value" id="ping">—<span class="metric-unit">ms</span></div></div>
      <div class="metric"><div class="metric-top"><span>Download</span><span>↓</span></div><div class="metric-value" id="download">—<span class="metric-unit">Mbps</span></div></div>
      <div class="metric"><div class="metric-top"><span>Upload</span><span>↑</span></div><div class="metric-value" id="upload">—<span class="metric-unit">Mbps</span></div></div>
    </aside>
  </main>

  <footer class="footer"><span>Liquid Speed</span><span>Measurements vary with network conditions and server distance.</span></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const els = {
  start:$("start"), again:$("again"), speed:$("speed"), unit:$("unit"), status:$("status"),
  headline:$("headline"), subtitle:$("subtitle"), gauge:$("gauge"),
  ping:$("ping"), download:$("download"), upload:$("upload")
};



const greeting = document.getElementById("greeting");

function updateGreeting() {
  const hour = new Date().getHours();
  greeting.textContent =
    hour >= 5 && hour < 12 ? "Good morning" :
    hour >= 12 && hour < 18 ? "Good afternoon" :
    "Good evening";
}

updateGreeting();

const themeToggle = document.getElementById("themeToggle");
const savedTheme = localStorage.getItem("liquid-speed-theme");
if(savedTheme === "dark") document.body.classList.add("dark");

const themeIcon = document.getElementById("themeIcon");

function updateThemeLabel(){
  const dark = document.body.classList.contains("dark");
  themeIcon.textContent = dark ? "☾" : "☀";
  themeToggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  themeToggle.setAttribute("title", dark ? "Switch to light mode" : "Switch to dark mode");
}
updateThemeLabel();

themeToggle.addEventListener("click", ()=>{
  document.body.classList.toggle("dark");
  localStorage.setItem("liquid-speed-theme",
    document.body.classList.contains("dark") ? "dark" : "light");
  updateThemeLabel();
});

document.querySelectorAll(".glass").forEach(tile=>{
  tile.addEventListener("pointermove", e=>{
    const r = tile.getBoundingClientRect();
    const x = ((e.clientX-r.left)/r.width)*100;
    const y = ((e.clientY-r.top)/r.height)*100;
    tile.style.setProperty("--reflection-x", `${x}%`);
    tile.style.setProperty("--reflection-y", `${y}%`);
  });
  tile.addEventListener("pointerleave", ()=>{
    tile.style.setProperty("--reflection-x", "50%");
    tile.style.setProperty("--reflection-y", "20%");
  });
});

const ENDPOINT = "https://speed.cloudflare.com";
const sizes = [1e6, 5e6, 10e6, 25e6];

function setGauge(value, max=1000){
  const pct = Math.max(0, Math.min(1, value / max));
  els.gauge.style.setProperty("--progress", `${pct * 360}deg`);
}
function showSpeed(value, label="Mbps"){
  els.speed.textContent = Number.isFinite(value) ? value.toFixed(value >= 100 ? 0 : 1) : "0";
  els.unit.textContent = label;
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }


async function loadConnectionIdentity() {
  const ipEl = document.getElementById("userIp");
  const providerEl = document.getElementById("userProvider");

  try {
    const response = await fetch("https://api.ipify.org?format=json", {
      cache: "no-store"
    });

    if (!response.ok) throw new Error("IP lookup failed");

    const data = await response.json();
    const ip = data.ip;

    if (!ip) throw new Error("No IP returned");

    ipEl.textContent = ip;

    try {
      const providerResponse = await fetch(
        `https://atlas.ipinfo.app/api/v2/ip/${encodeURIComponent(ip)}`,
        { cache: "no-store" }
      );

      if (!providerResponse.ok) throw new Error("Provider lookup failed");

      const network = await providerResponse.json();
      const provider = network.as_description?.trim();

      providerEl.textContent = provider || "Provider unavailable";
    } catch {
      providerEl.textContent = "Provider unavailable";
    }
  } catch {
    ipEl.textContent = "IP unavailable";
    providerEl.textContent = "Provider unavailable";
  }
}

loadConnectionIdentity();

async function timedFetch(url, options={}){
  const t0 = performance.now();
  const response = await fetch(url, {...options, cache:"no-store"});
  if(!response.ok) throw new Error("Network request failed");
  return {response, started:t0};
}

async function pingTest(){
  const samples=[];
  for(let i=0;i<5;i++){
    const t0=performance.now();
    try{
      await fetch(`${ENDPOINT}/__down?bytes=1&r=${crypto.randomUUID()}`, {cache:"no-store"});
      samples.push(performance.now()-t0);
    }catch{}
    await sleep(80);
  }
  if(!samples.length) throw new Error("Ping unavailable");
  samples.sort((a,b)=>a-b);
  return samples[Math.floor(samples.length/2)];
}

async function downloadTest(size){
  const {response,started}=await timedFetch(`${ENDPOINT}/__down?bytes=${size}&r=${crypto.randomUUID()}`);
  const reader=response.body?.getReader();
  let bytes=0, last=started, best=0;
  if(reader){
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      bytes += value.byteLength;
      const now=performance.now(), elapsed=(now-started)/1000;
      if(elapsed>0){
        const mbps=(bytes*8)/(elapsed*1e6);
        best=Math.max(best,mbps);
        showSpeed(mbps);
        setGauge(mbps, Math.max(100,best*1.25,1000));
        els.status.textContent="Downloading…";
      }
      last=now;
    }
  }else{
    const data=await response.arrayBuffer();
    bytes=data.byteLength;
  }
  const seconds=(performance.now()-started)/1000;
  return (bytes*8)/(seconds*1e6);
}

async function uploadTest(size){
  const data=new Uint8Array(size);
  crypto.getRandomValues(data.subarray(0, Math.min(size, 65536)));
  const t0=performance.now();
  const response=await fetch(`${ENDPOINT}/__up?r=${crypto.randomUUID()}`, {
    method:"POST",body:data,cache:"no-store",headers:{"Content-Type":"application/octet-stream"}
  });
  if(!response.ok) throw new Error("Upload request failed");
  await response.arrayBuffer().catch(()=>{});
  return (size*8)/((performance.now()-t0)/1000*1e6);
}

async function run(){
  els.start.disabled=true; els.again.hidden=true;
  els.headline.textContent="Checking your connection";
  els.subtitle.textContent="Measuring latency, then download and upload.";
  els.status.textContent="Finding latency…";
  showSpeed(0); setGauge(0);
  els.ping.innerHTML='—<span class="metric-unit">ms</span>';
  els.download.innerHTML='—<span class="metric-unit">Mbps</span>';
  els.upload.innerHTML='—<span class="metric-unit">Mbps</span>';

  try{
    const ping=await pingTest();
    els.ping.innerHTML=`${Math.round(ping)}<span class="metric-unit">ms</span>`;

    els.status.textContent="Starting download…";
    const d=[];
    for(const size of sizes){
      try{ d.push(await downloadTest(size)); }catch{}
      if(d.length>=2 && d[d.length-1] < d[d.length-2]*.55) break;
    }
    if(!d.length) throw new Error("Download test unavailable");
    const download=d.slice(-Math.min(3,d.length)).reduce((a,b)=>a+b,0)/Math.min(3,d.length);
    els.download.innerHTML=`${download.toFixed(download>=100?0:1)}<span class="metric-unit">Mbps</span>`;
    showSpeed(download);
    setGauge(download, Math.max(100,download*1.25));

    els.status.textContent="Checking upload…";
    const u=[];
    for(const size of [1e6,5e6,10e6]){
      try{u.push(await uploadTest(size));}catch{}
    }
    if(u.length){
      const upload=u.slice(-2).reduce((a,b)=>a+b,0)/Math.min(2,u.length);
      els.upload.innerHTML=`${upload.toFixed(upload>=100?0:1)}<span class="metric-unit">Mbps</span>`;
    }else{
      els.upload.innerHTML='—<span class="metric-unit">Mbps</span>';
    }

    els.headline.textContent="Your connection is ready";
    els.subtitle.textContent="Measured from this browser over a live network connection.";
    els.status.textContent="Complete";
    els.again.hidden=false;
  }catch(err){
    console.error(err);
    els.headline.textContent="We couldn't finish the test";
    els.subtitle.textContent="The speed test server did not accept the browser request. Try again or check your connection.";
    els.status.textContent="Test unavailable";
    els.again.hidden=false;
  }finally{
    els.start.disabled=false;
  }
}

els.start.addEventListener("click",run);
els.again.addEventListener("click",run);
</script>
</body>
</html>
